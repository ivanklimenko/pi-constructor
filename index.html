<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Конструктор валютной ПИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="skeleton.css">
<script src="skeleton.js"></script>
<link rel="stylesheet" href="prompt.css">
<script src="prompt.js"></script>
<style>
:root{
  --ground:#EEF1F6; --paper:#FFFFFF; --sunk:#F5F7FB; --ink:#141A29; --ink2:#3A4357; --muted:#6B7488; --faint:#7C8496;
  --line:#DCE1EA; --line2:#EAEEF4; --val:#3A6EA5; --val-soft:#E9EFF7; --hover:#F2F6FA; --opt:#B0247A; --opt-soft:#FBE8F3;
  --ok:#17844B; --ok-soft:#E3F5EA; --bad:#C2372E; --bad-soft:#FCE6E4; --warn:#A8620B; --warn-soft:#FDF1DD; --warn-row:#FFF9EE;
  --chip:#EEF0F4; --fold:#D0342C;
  --shadow:0 1px 2px rgba(20,26,41,.06),0 8px 28px rgba(20,26,41,.08);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E121A; --paper:#161B26; --sunk:#1B2130; --ink:#E6E9F1; --ink2:#C3C9D6; --muted:#949DB0; --faint:#8A93A6;
  --line:#2A3243; --line2:#222938; --val:#8FB8E0; --val-soft:#1E2B3E; --hover:#1B2331; --opt:#F07CC0; --opt-soft:#3A1830;
  --ok:#52CC8A; --ok-soft:#173526; --bad:#FF7A70; --bad-soft:#3D1B19; --warn:#F0B44E; --warn-soft:#3A2B12; --warn-row:#2A2216;
  --chip:#232A39; --fold:#FF6B61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0E121A; --paper:#161B26; --sunk:#1B2130; --ink:#E6E9F1; --ink2:#C3C9D6; --muted:#949DB0; --faint:#8A93A6;
  --line:#2A3243; --line2:#222938; --val:#8FB8E0; --val-soft:#1E2B3E; --hover:#1B2331; --opt:#F07CC0; --opt-soft:#3A1830;
  --ok:#52CC8A; --ok-soft:#173526; --bad:#FF7A70; --bad-soft:#3D1B19; --warn:#F0B44E; --warn-soft:#3A2B12; --warn-row:#2A2216;
  --chip:#232A39; --fold:#FF6B61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1290px;margin:0 auto;padding-inline:24px;padding-block:40px 80px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.25;font-weight:600;margin-bottom:12px}
h3{font-size:16px;font-weight:600}
p{margin:0;max-width:74ch;color:var(--ink2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px}
.lead{font-size:17px;margin-top:12px}
section{margin-top:56px}
code{font-family:var(--mono);font-size:.9em;background:var(--chip);padding:0 4px;border-radius:3px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:28px}
.stat{background:var(--paper);padding:16px 18px}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat b s{color:var(--muted);font-weight:400;font-size:18px;margin-right:6px}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:18px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{font:500 13px var(--sans);color:var(--ink2);background:none;border:0;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--val-soft);color:var(--val)}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer}
.chk input{accent-color:var(--val);width:15px;height:15px}
.meter{margin-left:auto;font:500 13px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.meter b{color:var(--ok)} .meter b.over{color:var(--fold)}
button:focus-visible,input:focus-visible,.cell[tabindex]:focus-visible{outline:2px solid var(--val);outline-offset:1px}

.stage{overflow-x:auto;overflow-y:hidden;padding:4px 16px 24px;margin-inline:calc(50% - 50vw)}
.pair{min-height:872px}
.pair{display:flex;gap:16px;justify-content:center;align-items:flex-start;width:max-content;margin:0 auto}
.pair.single .dw:nth-child(2){display:none}

/* ============ Drawer 800 px ============ */
.dw{position:relative;width:800px;flex:none;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.35;color:var(--ink)}
.fold{position:absolute;left:-8px;right:-8px;top:860px;border-top:1.5px dashed var(--fold);pointer-events:none;z-index:5}
.fold span{position:absolute;right:8px;top:-20px;font:500 10.5px var(--sans);color:var(--fold);background:var(--paper);padding:0 5px;border-radius:3px}
.no-fold .fold{display:none}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.v{color:var(--val)}
.lbl{color:var(--muted);font-size:11px}
.cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ar{color:var(--faint);margin:0 3px}
a.lnk{color:var(--val);text-decoration:none;cursor:pointer;font-weight:500}
a.lnk:hover{text-decoration:underline}

/* шапка */
.dh{display:flex;align-items:center;gap:10px;padding:10px 14px 8px 10px}
.back,.x{background:none;border:0;color:var(--ink2);cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:4px;flex:none}
.back:hover,.x:hover{background:var(--hover)}
.back svg,.x svg{width:18px;height:18px}
.dh b{font-size:16px;font-weight:700;white-space:nowrap}
.dh .mono{font-size:11.5px;color:var(--muted)}
.cp{background:none;border:0;padding:0 2px;color:var(--muted);cursor:pointer;font-size:11px;line-height:1}
.cp:hover{color:var(--val)}
.x{margin-left:auto}

/* лейн действий */
.lane{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 14px;background:var(--sunk);border-block:1px solid var(--line)}
.lane .kind{color:var(--ink2);font-size:12px}
.tag{font:500 10.5px var(--sans);padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.mt{font:600 11px var(--mono);background:var(--paper)}
.st{font:600 10.5px var(--sans);padding:2px 7px;border-radius:10px;white-space:nowrap;letter-spacing:.02em}
.st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.wait{background:var(--warn-soft);color:var(--warn)}
.acts{margin-left:auto;display:flex;align-items:center;gap:2px}
.ib{position:relative;width:30px;height:28px;display:grid;place-items:center;border:0;background:none;color:var(--ink2);border-radius:5px;cursor:pointer}
.ib svg{width:17px;height:17px}
.ib:hover{background:var(--paper);color:var(--val);box-shadow:0 0 0 1px var(--line)}
.ib.danger:hover{color:var(--bad)}
.ib[disabled]{color:var(--faint);cursor:not-allowed;background:none;box-shadow:none}
.ib .slot{position:absolute;top:1px;right:2px;font:600 8px var(--mono);color:var(--faint);display:none}
.show-slots .ib .slot{display:block}
.show-slots .ib{box-shadow:inset 0 0 0 1px var(--line);background:var(--paper)}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
/* подсказка не занимает место, пока не показана: иначе невидимая подсказка расширяет прокрутку drawer */
.tip{display:none;position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 11px var(--sans);padding:3px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:10}
.ib:hover .tip,.ib:focus-visible .tip{display:block}
.acts .ib:nth-last-child(-n+3) .tip{left:auto;right:0;transform:none}
.acts .ib:last-child .tip{left:auto;right:0;transform:none}

.tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs span{padding:7px 10px 6px;font-size:12.5px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--ink);font-weight:500;border-color:var(--val)}

.db{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}

/* сводка */
.hero{display:grid;grid-template-columns:auto auto auto 1fr;border:1px solid var(--line);border-radius:5px;background:var(--sunk)}
.hero>div{padding:5px 12px 6px;min-width:0}
.hero>div+div{border-left:1px solid var(--line)}
.hero .lbl{display:block;font-size:10.5px}
.hero .lbl[data-tip]{width:max-content;max-width:100%}
.hv{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .amtc{text-align:right}
/* правка управляющей даты валютирования */
.hero .vd .pen{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;vertical-align:-4px;
               border-radius:3px;color:transparent;cursor:pointer}
.hero .vd .pen svg{width:12px;height:12px}
.hero:hover .vd .pen{color:var(--muted)}
.hero .vd .pen:hover{color:var(--val);background:var(--val-soft)}
.hero .vd .vdinp{font:600 13px var(--sans);color:var(--ink);background:var(--paper);
                 border:1px solid var(--val);border-radius:4px;padding:0 4px;height:22px}
.hero .vd .vdx{border:0;background:none;font:500 11.5px var(--sans);color:var(--muted);cursor:pointer;padding:0 4px}
.hero .vd .vdx:hover{color:var(--val)}
.hero .vd.edited .hv{color:var(--warn)}
/* индикатор изменения реквизита: шарик — изменено; галочка под ним — изменение утверждено */
.hero .vd.edited .mark{display:inline-flex;flex-direction:column;align-items:center;gap:1px;vertical-align:middle;margin-left:5px;cursor:help}
.hero .vd.edited .mark i{display:block;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.hero .vd.edited .mark b{display:block;font:700 8px/8px var(--sans);color:var(--faint);visibility:hidden}
.hero .vd.edited .mark.ok b{visibility:visible;color:var(--ok)}
.amt{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.amt small{font-size:12px;color:var(--val);margin-left:5px;font-weight:600}
.amt .lnk{font-size:11.5px;margin-left:10px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--paper)}
.same{color:var(--ok);font-size:11px;margin-left:3px}
.diff{font:600 10.5px var(--sans);color:var(--warn);background:var(--warn-soft);padding:0 4px;border-radius:3px;margin-left:4px;cursor:help}

/* сообщения и счета */
.msgs{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:0;border:1px solid var(--line);border-radius:5px}
.msgs>div{padding:5px 10px 6px;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 8px;align-content:start}
.msgs>div+div{border-left:1px solid var(--line)}
.msgs h6{grid-column:1/-1;margin:0 0 1px;font:500 10.5px var(--sans);color:var(--muted);letter-spacing:.03em}

/* маршрут, транзакции */
.blk{border:1px solid var(--line);border-radius:5px}
.bh{display:flex;align-items:center;gap:8px;padding:4px 10px;min-height:26px}
.bh h5{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.tg{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:10px;padding:2px 4px}
.bb{padding:0 10px 6px;display:flex;flex-direction:column;gap:2px}
.blk.shut .bb{display:none}
.blk.shut .tg{transform:rotate(180deg)}
.ln{display:flex;align-items:baseline;gap:0 10px;white-space:nowrap;min-width:0}
.txh{cursor:pointer}
.txh:hover h5{color:var(--val)}
.cnt{font:600 11px var(--mono);background:var(--chip);color:var(--ink2);border-radius:9px;padding:0 6px}
.txs{display:flex;gap:3px}
.txs .st{padding:1px 6px 1px 5px;font-size:10px}
.tx{display:grid;grid-template-columns:62px 156px 150px 84px minmax(0,1fr) 104px;gap:0 10px;align-items:center;border-top:1px solid var(--line2);padding:3px 10px;min-height:25px;white-space:nowrap}
.tx>*{min-width:0}
.tx .tm{font:11.5px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.dir{font:600 10.5px var(--mono);color:var(--ink2);display:inline-flex;gap:4px;align-items:center}
.dir svg{width:12px;height:12px}
.tx .sum{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tx .sum small{color:var(--val);font-size:11px;margin-left:3px}

/* поля SWIFT */
.fh{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.fh h5{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.fh .lnk{margin-left:auto;font-size:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.cell{border:1px solid var(--line);border-radius:4px;padding:3px 8px;min-width:0;display:grid;grid-template-columns:26px 14px minmax(0,1fr) auto 16px 16px;gap:0 6px;align-items:center;min-height:27px;cursor:pointer;position:relative}
.cell:hover{border-color:var(--val)}
.fno{font:600 12px var(--mono);color:var(--ink)}
.op{font:700 12px var(--mono);color:var(--opt);text-align:center}
.mn{color:var(--val);font-weight:500}
.sc{font:11.5px var(--mono);color:var(--ink2);white-space:nowrap}
.eye{color:var(--faint);display:grid;place-items:center}
.eye svg{width:15px;height:15px}
.cell:hover .eye{color:var(--val)}
.pen{color:var(--faint);display:grid;place-items:center;cursor:pointer;border-radius:3px}
.pen svg{width:13px;height:13px}
.cell:hover .pen{color:var(--muted)}
.pen:hover{color:var(--val)!important;background:var(--val-soft)}
.cell.txt .pen{position:absolute;top:4px;right:6px}
.cell.editing{border-color:var(--val);box-shadow:inset 0 0 0 1px var(--val)}
.fe input.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.fe .cnt.bad{color:var(--bad);font-weight:600}
.fe .err{font:11px/1.3 var(--sans);color:var(--bad);margin-top:4px;min-height:14px}
.fe .btn[disabled]{opacity:.45;cursor:not-allowed}
.cell.null{cursor:default;border-style:dashed}
.cell.null:hover{border-color:var(--line)}
.cell.null .mn{color:var(--faint);font-weight:400}
.cell.null .eye{visibility:hidden}
.full{display:none;grid-column:3/-1;font:12px/1.45 var(--mono);color:var(--val);white-space:pre-wrap;margin:2px 0 3px;padding-top:3px;border-top:1px dashed var(--line)}
.cell.open .full{display:block}
.cell.open{align-content:start}
.cell.open>*{align-self:center}
.cell .full{grid-column:3/-1}
.cell.open .sc{visibility:hidden}
/* блок аудита изменений внутри раскрытого поля */
.cell .hs,.cell .hl{display:none;grid-column:3/-1}
.cell.open .hs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:3px 0 4px;padding-top:4px;border-top:1px dashed var(--line)}
.cell .hs-n{font:600 11px var(--sans);color:var(--ink2)}
.cell .hs .st{font-size:10px}
.cell .hs-t{margin-left:auto;font:500 11px var(--sans);color:var(--val);background:none;border:0;padding:0 2px;cursor:pointer}
.cell .hs-t:hover{text-decoration:underline}
.cell.open .hl{display:block;margin:0 0 6px;padding:0;list-style:none;border-left:2px solid var(--line)}
.cell .hl li{position:relative;padding:3px 0 5px 12px}
.cell .hl li::before{content:'';position:absolute;left:-5px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--paper)}
.cell .hl li.pend::before{background:var(--warn)}
.cell .hl-h{display:flex;align-items:center;gap:8px;font-size:11.5px}
.cell .hl-h b{font-weight:600;color:var(--ink)}
.cell .hl-h .tm{font:11px var(--mono);color:var(--muted)}
.cell .hl-h .st{font-size:10px;margin-left:auto}
.cell .hl-note{font-size:11px;color:var(--muted);margin-top:1px}
.cell .hl-d{display:flex;flex-direction:column;gap:1px;margin-top:2px;font:11.5px var(--mono);color:var(--ink2)}
.cell .hl-d s{color:var(--muted);text-decoration-color:var(--faint)}
.cell .hl-d b{color:var(--warn);font-weight:600}
.cell .ed{display:none;grid-column:3/-1;justify-self:start;font:500 11px var(--sans);color:var(--val);background:none;border:0;padding:0;cursor:pointer;margin-bottom:2px}
.cell.open .ed{display:block}
.cell.edited{background:var(--warn-row);border-color:var(--warn)}
.cell.edited .mn{color:var(--warn)}
.cell.edited::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--paper)}
.cell.txt{align-items:start;cursor:default;grid-template-columns:26px minmax(0,1fr);padding-right:24px}
.cell.txt:hover{border-color:var(--line)}
.cell.txt pre{margin:0;font:11.5px/1.42 var(--mono);color:var(--val);white-space:pre;min-height:65px;overflow:hidden}
.cell.txt.null pre{color:var(--faint)}
.cell.txt .fno{padding-top:1px}
.cell.txt.wide{grid-column:1/-1}
.cell.txt .more{grid-column:2;font-size:10.5px}
.cell.gap{border:0;cursor:default;visibility:hidden}
.xrow{display:flex;flex-wrap:wrap;gap:3px 16px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;white-space:nowrap}
.xrow .fno{margin-right:3px}
.xrow .nl{color:var(--faint)}
.tabs{position:relative;overflow:hidden;flex-wrap:nowrap}
.tabs span{flex:none}
.tabs .tdiv{width:1px;background:var(--line);margin:7px 6px;padding:0}
.tabs .off{color:var(--faint);cursor:default}
.tabs .off:hover{color:var(--faint)}
.tabs .more{margin-left:auto;cursor:pointer;color:var(--muted);font-weight:600;letter-spacing:.1em}
.tabs .more:hover{color:var(--ink)}
.toast{position:fixed;left:20px;bottom:24px;z-index:80;background:var(--ink);color:var(--paper);font:12px var(--sans);padding:6px 10px;border-radius:5px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;pointer-events:none}
.toast.on{opacity:1}
.actmenu{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);z-index:45;min-width:200px;padding:4px 0}
.actmenu .amt-t{font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:5px 12px 4px}
.actmenu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;font:12.5px var(--sans);color:var(--ink2);padding:6px 12px;cursor:pointer}
.actmenu button:hover{background:var(--hover);color:var(--ink)}
.actmenu button svg{width:14px;height:14px;color:var(--muted)}
.ib.hasmenu::after{content:'';position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-top-color:var(--faint);border-right-color:var(--faint);transform:rotate(45deg) scale(.8)}
.ib.hasmenu[aria-expanded="true"]{background:var(--paper);color:var(--val);box-shadow:0 0 0 1px var(--line)}

.sw.xml{padding:6px 10px 8px 0;white-space:normal;word-break:normal;counter-reset:xl}

/* Масштаб стенда: на 2K при 100% мелко — по умолчанию 125% для экранов шире 2200 px, выбор запоминается */
(function(){
  var KEY='pi-zoom',ZOOMS=[1,1.1,1.25];
  var saved=null;try{saved=parseFloat(localStorage.getItem(KEY))||null}catch(_){}
  var z=saved||(screen.width>=2200?1.25:1);
  function apply(v){z=v;document.documentElement.style.zoom=v;try{localStorage.setItem(KEY,String(v))}catch(_){}
    [].forEach.call(document.querySelectorAll('.zoomctl button'),function(b){b.setAttribute('aria-pressed',String(parseFloat(b.dataset.z)===v))})}
  document.addEventListener('DOMContentLoaded',function(){
    var host=document.getElementById('zoomctl');if(!host)return;
    host.innerHTML='<span class="lbl" style="margin-right:6px">Масштаб</span><span class="zoomctl">'+ZOOMS.map(function(v){return '<button type="button" data-z="'+v+'" title="Масштаб стенда '+Math.round(v*100)+'%">'+Math.round(v*100)+'%</button>'}).join('')+'</span>';
    host.addEventListener('click',function(e){var b=e.target.closest('[data-z]');if(b)apply(parseFloat(b.dataset.z))});
    apply(z);
  });
  document.documentElement.style.zoom=z;
})();
</script>

function fitTabs(el){

  var items=[].slice.call(bar.querySelectorAll('span[data-name]')),hidden=[];
  var more=document.createElement('span');more.className='more';more.textContent='•••';bar.appendChild(more);

/* XML показываем разобранным, а не подсвеченным регуляркой: отступ по вложенности,
   атрибуты — в строку, если тег помещается, иначе столбиком под первым атрибутом;
   длинный текст — отдельной строкой с висячим отступом. Не разобралось — сырой текст. */
var XML_LINE=92;
function xmlHtml(t){
  var doc=null;try{doc=new DOMParser().parseFromString(t,'application/xml')}catch(_){}
  if(!doc||doc.getElementsByTagName('parsererror').length)return '<div class="xl">'+esc(t)+'</div>';
  var out=[];
  function P(x){return '<span class="xp">'+x+'</span>'}
  function nm(n){var i=n.indexOf(':');return i>0?'<span class="xns">'+esc(n.slice(0,i+1))+'</span>'+esc(n.slice(i+1)):esc(n)}
  function at(a){return '<span class="xa">'+nm(a.name)+'</span>'+P('="')+'<span class="xv">'+esc(a.value)+'</span>'+P('"')}
  function line(d,h,a){out.push('<div class="xl" style="--d:'+d+(a?';--a:'+a:'')+'">'+h+'</div>')}
  var decl=/^\s*<\?xml([^?]*)\?>/.exec(t);
  if(decl)line(0,P('&lt;?xml')+decl[1].replace(/([\w:.-]+)="([^"]*)"/g,function(m,k,v){return '<span class="xa">'+esc(k)+'</span>'+P('="')+'<span class="xv">'+esc(v)+'</span>'+P('"')})+P('?&gt;'));
  function walk(el,d){
    var kids=[].filter.call(el.childNodes,function(n){return n.nodeType===1||((n.nodeType===3||n.nodeType===4)&&n.nodeValue.trim())});
    var attrs=[].slice.call(el.attributes),name=el.nodeName;
    var open=P('&lt;')+'<span class="xt">'+nm(name)+'</span>',end=kids.length?P('&gt;'):P('/&gt;');
    var close=P('&lt;/')+'<span class="xt">'+nm(name)+'</span>'+P('&gt;');
    var text=kids.length===1&&kids[0].nodeType!==1?kids[0].nodeValue.trim():null;
    var headLen=d*2+name.length+2+attrs.reduce(function(s,a){return s+a.name.length+a.value.length+4},0);
    if(headLen<=XML_LINE){
      var head=open+attrs.map(function(a){return ' '+at(a)}).join('')+end;
      if(text!=null&&headLen+text.length+name.length+3<=XML_LINE){line(d,head+'<span class="xx">'+esc(text)+'</span>'+close);return}
      line(d,head);
    }else{
      /* атрибуты столбиком: выравнивание под первым атрибутом — моноширинный шрифт, считаем в ch */
      attrs.forEach(function(a,k){var last=k===attrs.length-1;
        if(k===0)line(d,open+' '+at(a)+(last?end:''));else line(d,at(a)+(last?end:''),name.length+2)});
    }
    if(!kids.length)return;
    if(text!=null)line(d+1,'<span class="xx">'+esc(text)+'</span>');
    else kids.forEach(function(n){if(n.nodeType===1)walk(n,d+1);else line(d+1,'<span class="xx">'+esc(n.nodeValue.trim())+'</span>')});
    line(d,close);
  }
  walk(doc.documentElement,0);
  return out.join('');
}
