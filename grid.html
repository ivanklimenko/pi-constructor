<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Валютные документы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="filters.css">
<link rel="stylesheet" href="skeleton.css">
<script src="skeleton.js"></script>
<link rel="stylesheet" href="prompt.css">
<script src="prompt.js"></script>
<link rel="stylesheet" href="chart.css">
<script src="chart.js"></script>
<style>
:root{
  --ground:#EEF1F6; --paper:#FFFFFF; --sunk:#F5F7FB; --ink:#141A29; --ink2:#3A4357; --muted:#6B7488; --faint:#7C8496;
  --line:#DCE1EA; --line2:#EAEEF4; --val:#3A6EA5; --val-soft:#E9EFF7; --hover:#F2F6FA; --opt:#B0247A; --opt-soft:#FBE8F3;
  --ok:#17844B; --ok-soft:#E3F5EA; --bad:#C2372E; --bad-soft:#FCE6E4; --warn:#A8620B; --warn-soft:#FDF1DD; --warn-row:#FFF9EE;
  --chip:#EEF0F4; --fold:#D0342C;
  --shadow:0 1px 2px rgba(20,26,41,.06),0 8px 28px rgba(20,26,41,.08);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E121A; --paper:#161B26; --sunk:#1B2130; --ink:#E6E9F1; --ink2:#C3C9D6; --muted:#949DB0; --faint:#8A93A6;
  --line:#2A3243; --line2:#222938; --val:#8FB8E0; --val-soft:#1E2B3E; --hover:#1B2331; --opt:#F07CC0; --opt-soft:#3A1830;
  --ok:#52CC8A; --ok-soft:#173526; --bad:#FF7A70; --bad-soft:#3D1B19; --warn:#F0B44E; --warn-soft:#3A2B12; --warn-row:#2A2216;
  --chip:#232A39; --fold:#FF6B61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0E121A; --paper:#161B26; --sunk:#1B2130; --ink:#E6E9F1; --ink2:#C3C9D6; --muted:#949DB0; --faint:#8A93A6;
  --line:#2A3243; --line2:#222938; --val:#8FB8E0; --val-soft:#1E2B3E; --hover:#1B2331; --opt:#F07CC0; --opt-soft:#3A1830;
  --ok:#52CC8A; --ok-soft:#173526; --bad:#FF7A70; --bad-soft:#3D1B19; --warn:#F0B44E; --warn-soft:#3A2B12; --warn-row:#2A2216;
  --chip:#232A39; --fold:#FF6B61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1290px;margin:0 auto;padding-inline:24px;padding-block:40px 80px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.25;font-weight:600;margin-bottom:12px}
h3{font-size:16px;font-weight:600}
p{margin:0;max-width:74ch;color:var(--ink2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px}
.lead{font-size:17px;margin-top:12px}
section{margin-top:56px}
code{font-family:var(--mono);font-size:.9em;background:var(--chip);padding:0 4px;border-radius:3px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:28px}
.stat{background:var(--paper);padding:16px 18px}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat b s{color:var(--muted);font-weight:400;font-size:18px;margin-right:6px}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:18px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{font:500 13px var(--sans);color:var(--ink2);background:none;border:0;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--val-soft);color:var(--val)}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer}
.chk input{accent-color:var(--val);width:15px;height:15px}
.meter{margin-left:auto;font:500 13px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.meter b{color:var(--ok)} .meter b.over{color:var(--fold)}
button:focus-visible,input:focus-visible,.cell[tabindex]:focus-visible{outline:2px solid var(--val);outline-offset:1px}

.stage{overflow-x:auto;overflow-y:hidden;padding:4px 16px 24px;margin-inline:calc(50% - 50vw)}
.pair{min-height:872px}
.pair{display:flex;gap:16px;justify-content:center;align-items:flex-start;width:max-content;margin:0 auto}
.pair.single .dw:nth-child(2){display:none}

/* ============ Drawer 800 px ============ */
.dw{position:relative;width:800px;flex:none;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.35;color:var(--ink)}
.fold{position:absolute;left:-8px;right:-8px;top:860px;border-top:1.5px dashed var(--fold);pointer-events:none;z-index:5}
.fold span{position:absolute;right:8px;top:-20px;font:500 10.5px var(--sans);color:var(--fold);background:var(--paper);padding:0 5px;border-radius:3px}
.no-fold .fold{display:none}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.v{color:var(--val)}
.lbl{color:var(--muted);font-size:11px}
.cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ar{color:var(--faint);margin:0 3px}
a.lnk{color:var(--val);text-decoration:none;cursor:pointer;font-weight:500}
a.lnk:hover{text-decoration:underline}

/* шапка */
.dh{display:flex;align-items:center;gap:10px;padding:10px 14px 8px 10px}
.back,.x{background:none;border:0;color:var(--ink2);cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:4px;flex:none}
.back:hover,.x:hover{background:var(--hover)}
.back svg,.x svg{width:18px;height:18px}
.dh b{font-size:16px;font-weight:700;white-space:nowrap}
.dh .mono{font-size:11.5px;color:var(--muted)}
.cp{background:none;border:0;padding:0 2px;color:var(--muted);cursor:pointer;font-size:11px;line-height:1}
.cp:hover{color:var(--val)}
.x{margin-left:auto}

/* лейн действий */
.lane{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 14px;background:var(--sunk);border-block:1px solid var(--line)}
.lane .kind{color:var(--ink2);font-size:12px}
.tag{font:500 10.5px var(--sans);padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.mt{font:600 11px var(--mono);background:var(--paper)}
.st{font:600 10.5px var(--sans);padding:2px 7px;border-radius:10px;white-space:nowrap;letter-spacing:.02em}
.st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.wait{background:var(--warn-soft);color:var(--warn)}
.acts{margin-left:auto;display:flex;align-items:center;gap:2px}
.ib{position:relative;width:30px;height:28px;display:grid;place-items:center;border:0;background:none;color:var(--ink2);border-radius:5px;cursor:pointer}
.ib svg{width:17px;height:17px}
.ib:hover{background:var(--paper);color:var(--val);box-shadow:0 0 0 1px var(--line)}
.ib.danger:hover{color:var(--bad)}
.ib[disabled]{color:var(--faint);cursor:not-allowed;background:none;box-shadow:none}
.ib .slot{position:absolute;top:1px;right:2px;font:600 8px var(--mono);color:var(--faint);display:none}
.show-slots .ib .slot{display:block}
.show-slots .ib{box-shadow:inset 0 0 0 1px var(--line);background:var(--paper)}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tip{position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 11px var(--sans);padding:3px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;z-index:10}
.ib:hover .tip,.ib:focus-visible .tip{opacity:1}
.acts .ib:last-child .tip{left:auto;right:0;transform:none}

.tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs span{padding:7px 10px 6px;font-size:12.5px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--ink);font-weight:500;border-color:var(--val)}

.db{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}

/* сводка */
.hero{display:grid;grid-template-columns:auto auto auto 1fr;border:1px solid var(--line);border-radius:5px;background:var(--sunk)}
.hero>div{padding:5px 12px 6px;min-width:0}
.hero>div+div{border-left:1px solid var(--line)}
.hero .lbl{display:block;font-size:10.5px}
.hero .lbl[data-tip]{width:max-content;max-width:100%}
.hv{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .amtc{text-align:right}
/* правка управляющей даты валютирования */
.hero .vd .pen{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;vertical-align:-4px;
               border-radius:3px;color:transparent;cursor:pointer}
.hero .vd .pen svg{width:12px;height:12px}
.hero:hover .vd .pen{color:var(--muted)}
.hero .vd .pen:hover{color:var(--val);background:var(--val-soft)}
.hero .vd .vdinp{font:600 13px var(--sans);color:var(--ink);background:var(--paper);
                 border:1px solid var(--val);border-radius:4px;padding:0 4px;height:22px}
.hero .vd .vdx{border:0;background:none;font:500 11.5px var(--sans);color:var(--muted);cursor:pointer;padding:0 4px}
.hero .vd .vdx:hover{color:var(--val)}
.hero .vd.edited .hv{color:var(--warn)}
.hero .vd.edited .mark{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);vertical-align:3px;margin-left:4px}
.amt{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.amt small{font-size:12px;color:var(--val);margin-left:5px;font-weight:600}
.amt .lnk{font-size:11.5px;margin-left:10px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--paper)}
.same{color:var(--ok);font-size:11px;margin-left:3px}
.diff{font:600 10.5px var(--sans);color:var(--warn);background:var(--warn-soft);padding:0 4px;border-radius:3px;margin-left:4px;cursor:help}

/* сообщения и счета */
.msgs{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:0;border:1px solid var(--line);border-radius:5px}
.msgs>div{padding:5px 10px 6px;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 8px;align-content:start}
.msgs>div+div{border-left:1px solid var(--line)}
.msgs h6{grid-column:1/-1;margin:0 0 1px;font:500 10.5px var(--sans);color:var(--muted);letter-spacing:.03em}

/* маршрут, транзакции */
.blk{border:1px solid var(--line);border-radius:5px}
.bh{display:flex;align-items:center;gap:8px;padding:4px 10px;min-height:26px}
.bh h5{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.tg{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:10px;padding:2px 4px}
.bb{padding:0 10px 6px;display:flex;flex-direction:column;gap:2px}
.blk.shut .bb{display:none}
.blk.shut .tg{transform:rotate(180deg)}
.ln{display:flex;align-items:baseline;gap:0 10px;white-space:nowrap;min-width:0}
.txh{cursor:pointer}
.txh:hover h5{color:var(--val)}
.cnt{font:600 11px var(--mono);background:var(--chip);color:var(--ink2);border-radius:9px;padding:0 6px}
.txs{display:flex;gap:3px}
.txs .st{padding:1px 6px 1px 5px;font-size:10px}
.tx{display:grid;grid-template-columns:62px 84px 156px minmax(0,1fr) 104px 150px;gap:0 10px;align-items:center;border-top:1px solid var(--line2);padding:3px 10px;min-height:25px;white-space:nowrap}
.tx>*{min-width:0}
.tx .tm{font:11.5px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.dir{font:600 10.5px var(--mono);color:var(--ink2);display:inline-flex;gap:4px;align-items:center}
.dir svg{width:12px;height:12px}
.tx .sum{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tx .sum small{color:var(--val);font-size:11px;margin-left:3px}

/* поля SWIFT */
.fh{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.fh h5{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.fh .lnk{margin-left:auto;font-size:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.cell{border:1px solid var(--line);border-radius:4px;padding:3px 8px;min-width:0;display:grid;grid-template-columns:26px 14px minmax(0,1fr) auto 16px 16px;gap:0 6px;align-items:center;min-height:27px;cursor:pointer;position:relative}
.cell:hover{border-color:var(--val)}
.fno{font:600 12px var(--mono);color:var(--ink)}
.op{font:700 12px var(--mono);color:var(--opt);text-align:center}
.mn{color:var(--val);font-weight:500}
.sc{font:11.5px var(--mono);color:var(--ink2);white-space:nowrap}
.eye{color:var(--faint);display:grid;place-items:center}
.eye svg{width:15px;height:15px}
.cell:hover .eye{color:var(--val)}
.pen{color:var(--faint);display:grid;place-items:center;cursor:pointer;border-radius:3px}
.pen svg{width:13px;height:13px}
.cell:hover .pen{color:var(--muted)}
.pen:hover{color:var(--val)!important;background:var(--val-soft)}
.cell.txt .pen{position:absolute;top:4px;right:6px}
.cell.editing{border-color:var(--val);box-shadow:inset 0 0 0 1px var(--val)}
.fe input.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.fe .cnt.bad{color:var(--bad);font-weight:600}
.fe .err{font:11px/1.3 var(--sans);color:var(--bad);margin-top:4px;min-height:14px}
.fe .btn[disabled]{opacity:.45;cursor:not-allowed}
.cell.null{cursor:default;border-style:dashed}
.cell.null:hover{border-color:var(--line)}
.cell.null .mn{color:var(--faint);font-weight:400}
.cell.null .eye{visibility:hidden}
.full{display:none;grid-column:3/-1;font:12px/1.45 var(--mono);color:var(--val);white-space:pre-wrap;margin:2px 0 3px;padding-top:3px;border-top:1px dashed var(--line)}
.cell.open .full{display:block}
.cell.open{align-content:start}
.cell.open>*{align-self:center}
.cell .full{grid-column:3/-1}
.cell.open .sc{visibility:hidden}
.cell .ed{display:none;grid-column:3/-1;justify-self:start;font:500 11px var(--sans);color:var(--val);background:none;border:0;padding:0;cursor:pointer;margin-bottom:2px}
.cell.open .ed{display:block}
.cell.edited{background:var(--warn-row);border-color:var(--warn)}
.cell.edited .mn{color:var(--warn)}
.cell.edited::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--paper)}
.cell.txt{align-items:start;cursor:default;grid-template-columns:26px minmax(0,1fr);padding-right:24px}
.cell.txt:hover{border-color:var(--line)}
.cell.txt pre{margin:0;font:11.5px/1.42 var(--mono);color:var(--val);white-space:pre;min-height:65px;overflow:hidden}
.cell.txt.null pre{color:var(--faint)}
.cell.txt .fno{padding-top:1px}
.cell.txt.wide{grid-column:1/-1}
.cell.txt .more{grid-column:2;font-size:10.5px}
.cell.gap{border:0;cursor:default;visibility:hidden}
.xrow{display:flex;flex-wrap:wrap;gap:3px 16px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;white-space:nowrap}
.xrow .fno{margin-right:3px}
.xrow .nl{color:var(--faint)}
.tabs{position:relative;overflow:hidden;flex-wrap:nowrap}
.tabs span{flex:none}
.tabs .tdiv{width:1px;background:var(--line);margin:7px 6px;padding:0}
.tabs .off{color:var(--faint);cursor:default}
.tabs .off:hover{color:var(--faint)}
.tabs .more{margin-left:auto;cursor:pointer;color:var(--muted);font-weight:600;letter-spacing:.1em}
.tabs .more:hover{color:var(--ink)}
.tabmenu{position:absolute;right:14px;background:var(--paper);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);z-index:40;min-width:180px;padding:4px 0}
.tabmenu span{display:block;padding:5px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabmenu span .lbl{display:inline;padding:0;margin-left:4px}
.tabmenu span:hover{background:var(--hover)}
.tabmenu span.off{color:var(--faint);cursor:default}
.tabmenu span.off:hover{background:none}
.tabs span[data-tab]{cursor:pointer}
.tabs span[data-tab]:hover{color:var(--ink)}
.xg{border:1px solid var(--line);border-radius:5px}
.xg h6{margin:0;padding:4px 10px;font:600 11.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--line2);background:var(--sunk)}
.xr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 10px;align-items:center;min-height:24px;padding:1px 10px;border-bottom:1px solid var(--line2)}
.xr:last-child{border-bottom:0}
.xg.byname .xr{grid-template-columns:150px minmax(0,1fr)}
.xr .nm{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr .kv{display:flex;flex-wrap:wrap;gap:0 14px;align-items:baseline;min-width:0}
.xr .kv>span{white-space:nowrap}
.xr .kv .lbl{margin-right:4px}
.xr .len{font-size:10.5px;color:var(--faint);margin-left:auto}
.xr .diffd{color:var(--warn);font-weight:600}
[data-tip]{position:relative;cursor:help}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:0;background:var(--ink);color:var(--paper);font:500 11px/1.3 var(--sans);letter-spacing:0;text-transform:none;padding:3px 7px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s .15s;z-index:30}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}
.cell .op[data-tip]::after,.xr .kv .lbl[data-tip]::after{left:50%;transform:translateX(-50%)}
/* прочие вкладки */
.tt{border:1px solid var(--line);border-radius:5px;overflow:hidden}
.tt .th,.tt .tr{display:grid;gap:0 10px;align-items:center;padding:0 10px;min-height:24px;border-bottom:1px solid var(--line2)}
.tt .th{background:var(--sunk);font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-height:22px}
.tt .tr:last-child{border-bottom:0}
.tt .tr:hover{background:var(--hover)}
.tt .n{color:var(--faint);font:11px var(--mono);text-align:right}
.tt .tm{font:11.5px var(--mono);color:var(--ink2);white-space:nowrap}
.tt .tm b{font-weight:500;color:var(--ink)}
.tt .code{font:12px var(--mono);color:var(--val);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .code .suf{color:var(--muted)}
.tt .code .suf.end{color:var(--ok)}
.tt .code .fin{color:var(--ok);font-weight:600}
.tt .reason{color:var(--warn);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .empty{padding:14px 10px;color:var(--muted);font-size:12px;text-align:center}
.tt .dur{font:10.5px var(--mono);color:var(--faint);text-align:right}
.tt .dur.slow{color:var(--warn)}

<script>
/* Масштаб стенда: на 2K при 100% мелко — по умолчанию 125% для экранов шире 2200 px, выбор запоминается */
(function(){
  var KEY='pi-zoom',ZOOMS=[1,1.1,1.25];
  var saved=null;try{saved=parseFloat(localStorage.getItem(KEY))||null}catch(_){}
  var z=saved||(screen.width>=2200?1.25:1);
  function apply(v){z=v;document.documentElement.style.zoom=v;try{localStorage.setItem(KEY,String(v))}catch(_){}
    [].forEach.call(document.querySelectorAll('.zoomctl button'),function(b){b.setAttribute('aria-pressed',String(parseFloat(b.dataset.z)===v))})}
  document.addEventListener('DOMContentLoaded',function(){
    var host=document.getElementById('zoomctl');if(!host)return;
    host.innerHTML='<span class="lbl" style="margin-right:6px">Масштаб</span><span class="zoomctl">'+ZOOMS.map(function(v){return '<button type="button" data-z="'+v+'" title="Масштаб стенда '+Math.round(v*100)+'%">'+Math.round(v*100)+'%</button>'}).join('')+'</span>';
    host.addEventListener('click',function(e){var b=e.target.closest('[data-z]');if(b)apply(parseFloat(b.dataset.z))});
    apply(z);
  });
  document.documentElement.style.zoom=z;
})();
</script>

function renderPager(total,pages){
  var from=total?(PAGE.n-1)*PAGE.size+1:0,to=Math.min(PAGE.n*PAGE.size,total);
  var nums=[],push=function(x){if(nums.indexOf(x)<0)nums.push(x)};
  push(1);for(var p=PAGE.n-1;p<=PAGE.n+1;p++)if(p>1&&p<pages)push(p);if(pages>1)push(pages);
  nums.sort(function(a,b){return a-b});
  var html='',prev=0;nums.forEach(function(p){if(p-prev>1)html+='<span class="gap">…</span>';html+='<button type="button" class="'+(p===PAGE.n?'on':'')+'" data-page="'+p+'">'+p+'</button>';prev=p});
  document.getElementById('foot').innerHTML='<span>'+from+'–'+to+' из '+total+' · выбрано 0</span>';
  document.getElementById('pager').innerHTML='<button type="button" data-page="'+(PAGE.n-1)+'" '+(PAGE.n<=1?'disabled':'')+' aria-label="Назад">‹</button>'+html+'<button type="button" data-page="'+(PAGE.n+1)+'" '+(PAGE.n>=pages?'disabled':'')+' aria-label="Вперёд">›</button>';
}

/* ---- фильтры: каталог для реестра (конструктив из vtb-filters), значения справочников — из строк ---- */
function uniq(fn){var s={};ROWS.forEach(function(d){var v=fn(d);if(v)s[v]=1});return Object.keys(s).sort()}
function lines(d,t){var f=d.f[t];return f?(f.edit||f).lines:[]}
function bic(d,t){var L=lines(d,t);return L[L.length-1]||''}
var ACC={
  docId:function(d){return d.uuid},docNumber:function(d){return d.num},refIn:function(d){return d.f['20'].lines[0]},refOut:function(d){return d.r20out},
  status:function(d){return SM[d.status].label},reason:function(d){return d.reason},type:function(d){return d.type},direction:function(d){return d.dir},dirTxt:function(d){return d.dirTxt},purpose:function(d){return lines(d,'70').join(' ')},
  created:function(d){return d.created.slice(0,10)},valueDate:function(d){return d.vd[0]},vdDt:function(d){return d.vd[2]},vdKt:function(d){return d.vd[3]},
  amount:function(d){return d.amount.replace(/\s/g,'')},currency:function(d){return d.ccy},dtAcc:function(d){return d.dt.replace(/\s/g,'')},ktAcc:function(d){return d.kt.replace(/\s/g,'')},
  f50name:function(d){return lines(d,'50')[0]||''},f50acc:function(d){return (d.f['50']||{}).acc||''},f59name:function(d){return lines(d,'59')[0]||''},f59acc:function(d){return (d.f['59']||{}).acc||''},
  f52:function(d){return bic(d,'52')},f57:function(d){return bic(d,'57')},f58:function(d){return bic(d,'58')},
  routeType:function(d){return d.route.type},routeRecv:function(d){return d.route.recv},sender:function(d){return d.inS},receiver:function(d){return d.inR},
  outSender:function(d){return d.outS},outReceiver:function(d){return d.outR},provS:function(d){return d.provS},provR:function(d){return d.provR}
};
function F(id,label,type,dict){return {id:id,label:label,type:type||'text',dict:dict||uniq(ACC[id]).slice(0,12)}}
var CATALOG=[
  {group:'Основные',fields:[F('docId','ID документа'),F('docNumber','Номер документа'),F('refIn','Поле 20 (входящее)'),F('refOut','Поле 20 (исходящее)'),F('status','Статус','select',STATUS_META.map(function(x){return x[1]})),F('reason','Причина статуса','select',REASONS),F('type','Тип сообщения','select'),F('direction','Группа направления','select',['IN','OUT','TRANSIT','OTHER']),F('dirTxt','Название направления','select'),F('purpose','Назначение (70)')]},
  {group:'Даты',fields:[F('created','Дата документа','date'),F('valueDate','Дата валютирования','date'),F('vdDt','Валютирование по Дт','date'),F('vdKt','Валютирование по Кт','date')]},
  {group:'Финансы',fields:[F('amount','Сумма','number'),F('currency','Валюта','select'),F('dtAcc','Счёт Дт'),F('ktAcc','Счёт Кт')]},
  {group:'Контрагенты',fields:[F('f50name','Поле 50 (наименование)'),F('f50acc','Поле 50 (счёт)'),F('f59name','Поле 59 (наименование)'),F('f59acc','Поле 59 (счёт)')]},
  {group:'Банки (SWIFT-коды)',fields:[F('f52','Поле 52'),F('f57','Поле 57'),F('f58','Поле 58')]},
  {group:'Маршрут',fields:[F('routeType','Тип маршрута','select'),F('routeRecv','Receiver'),F('sender','S in'),F('receiver','R in'),F('outSender','S out'),F('outReceiver','R out'),F('provS','Провайдер отправителя','select'),F('provR','Провайдер получателя','select')]}
];
var DEMO_SETS=[
  {id:'demo-1',name:'Входящие USD исполненные',data:{visible:['direction','currency','status'],ops:{direction:'eq',currency:'eq',status:'eq'},values:{direction:{list:[],draft:'IN'},currency:{list:[],draft:'USD'},status:{list:[],draft:'Обработан'}}}},
  {id:'demo-2',name:'Проблемные MT103/MT202',data:{visible:['type','status','amount'],ops:{type:'in',status:'in',amount:'gt'},values:{type:{list:['MT103','MT202'],draft:''},status:{list:['Ошибка','Отказ','INVALID'],draft:''},amount:{list:[],draft:'100000'}}}}];
function toNum(v){var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n}
function toDate(v){var m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(v).trim());if(m)return m[3]+m[2]+m[1];m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v).trim());return m?m[1]+m[2]+m[3]:null}
function cmp(field,a,b){if(field.type==='number'){var x=toNum(a),y=toNum(b);return x==null||y==null?null:x-y}if(field.type==='date'){var p=toDate(a),q=toDate(b);return p==null||q==null?null:(p<q?-1:p>q?1:0)}return String(a).localeCompare(String(b))}
function match(field,op,val,cond,list){
  var v=String(val==null?'':val),lv=v.toLowerCase(),c=String(cond||'').trim(),lc=c.toLowerCase();
  switch(op){
    case 'contains':return lv.indexOf(lc)>=0;
    case 'startsWith':return lv.indexOf(lc)===0;
    case 'endsWith':return lv.slice(-lc.length)===lc;
    case 'eq':return field.type==='number'||field.type==='date'?cmp(field,v,c)===0:lv===lc;
    case 'ne':return field.type==='number'||field.type==='date'?cmp(field,v,c)!==0:lv!==lc;
    case 'gt':var g=cmp(field,v,c);return g!=null&&g>0;
    case 'lt':var l=cmp(field,v,c);return l!=null&&l<0;
    case 'in':return list.some(function(x){return field.type==='number'||field.type==='date'?cmp(field,v,x)===0:String(x).toLowerCase()===lv});
    case 'notIn':return !list.some(function(x){return field.type==='number'||field.type==='date'?cmp(field,v,x)===0:String(x).toLowerCase()===lv});
  }return true;
}
var cf=window.CF({root:document.getElementById('cf-host'),catalog:CATALOG,defaultIds:['refIn','status','type','currency'],demoSets:DEMO_SETS,storageKey:'pi-grid-filter-sets-v1',

function byPanel(){return ROWS.map(function(_,i){return i}).filter(function(i){var d=ROWS[i];return applied.every(function(c){var field=cf.FIELD_BY_ID[c.id];return match(field,c.op,ACC[c.id](d),c.values[0],c.values)})})}

/* ============ график динамики по статусам ============
   Данные стенда: ряды заканчиваются ровно на счётчиках лейна, иначе
   график противоречил бы числам прямо над ним. Шаг — минута, как у
   метода бекенда; агрегация на бекенде, здесь только отрисовка. */
/* цвет берём токеном: тёмная тема имеет свои шаги, проверенные к своей поверхности */
var SC_COLOR={};['flow','flowl','flowd','bad','badd','warn','ok','okl','grey']
  .forEach(function(k){SC_COLOR[k]='var(--st-'+k+')'});
/* диапазоны панели; шаг ряда всегда минутный, как отдаёт бекенд */
function minutesToday(){var d=new Date();return Math.max(60,d.getHours()*60+d.getMinutes()+1)}
var CH_RANGES=[{label:'Сегодня',minutes:0},{label:'3 дня',minutes:4320},{label:'7 дней',minutes:10080}];
var chCtl=null,chTimer=null;

function genPoints(end,n,seed){
  /* Свободное блуждание за 720 минут уходит далеко от текущего значения
     и упирается в ноль. Очередь так себя не ведёт: она колеблется вокруг
     своего уровня. Поэтому медленная волна + мелкая рябь + слабый шум. */
  var r=seed||1;
  function rnd(){r=(r*1103515245+12345)&0x7fffffff;return r/0x7fffffff}
  var base=Math.max(end,1),ph1=rnd()*6.283,ph2=rnd()*6.283,
      sw=1.2+rnd()*1.6,out=new Array(n);
  for(var i=0;i<n;i++){
    var t=i/(n-1),
        wave=Math.sin(t*6.283*sw+ph1)*0.30+Math.sin(t*6.283*5+ph2)*0.10,
        noise=(rnd()-0.5)*0.07;
    out[i]=Math.max(0,Math.round(base*(1+wave+noise)));
  }
  out[n-1]=end;                    /* последняя точка равна счётчику лейна */
  return out;
}
function chSeries(minutes){
  /* По всем документам, а не по текущей выборке: график показывает
     обстановку в системе. От lastIdx у скрытых статусов обнулялись
     ряды, и переключение линий переставало что-либо показывать. */
  var cnt={};ROWS.forEach(function(r){cnt[r.status]=(cnt[r.status]||0)+1});
  return STATUS_META.map(function(x,k){
    return {key:x[0],label:x[1],color:SC_COLOR[x[2]]||'#3A6EA5',points:genPoints(cnt[x[0]]||0,minutes,7919*(k+1)+13)};
  });
}
function chClose(){
  if(chTimer){clearInterval(chTimer);chTimer=null}
  chCtl=null;var h=document.getElementById('chhost');h.innerHTML='';h.className='';
  var b=document.getElementById('chartbtn');if(b)b.setAttribute('aria-pressed','false');
}
function chOpen(){
  var host=document.getElementById('chhost');
  document.getElementById('chartbtn').setAttribute('aria-pressed','true');
  /* первая загрузка — скелетоны панелей той же геометрии */
  host.className='ch';
  host.innerHTML='<div class="ch-head"><h3>Динамика по статусам</h3></div>'+
    '<div class="ch-plot">'+SK.sk('100%','116px','sq')+'</div>'+
    '<div class="ch-leg">'+STATUS_META.map(function(){return SK.sk('84px','22px','sq')}).join('')+'</div>';
  setTimeout(function(){
    chCtl=CH.mount(host,{series:chSeries(minutesToday()),endAt:new Date(),stepMin:1,minutes:0,
      ranges:CH_RANGES,
      onRange:function(m){chCtl.cfg.series=chSeries(m||minutesToday());chCtl.cfg.endAt=new Date()},
      onClose:chClose});
    /* бекенд складывает срез раз в минуту — обновляемся в том же такте */
    chTimer=setInterval(chRefresh,60000);
  },450);
}
function chRefresh(){
  if(!chCtl)return;
  chCtl.cfg.busy=true;chCtl.render();
  setTimeout(function(){
    chCtl.cfg.series=chSeries(chCtl.cfg.minutes||minutesToday());chCtl.cfg.endAt=new Date();
    chCtl.cfg.busy=false;chCtl.render();
  },500);
}
var chBtnEl=document.getElementById('chartbtn');
chBtnEl.innerHTML=ic('chart');
chBtnEl.addEventListener('click',function(){chCtl?chClose():chOpen()});

/* лейн статусов: счётчики по текущей выборке панели и быстрый фильтр (один статус или все) */
function renderLane(base){

  var el=document.getElementById('slane');
  el.innerHTML='<button type="button" data-st="" aria-pressed="'+(!quick)+'">Все<span class="n">'+base.length+'</span></button>'+
    STATUS_META.map(function(x){var n=cnt[x[0]]||0;return '<button type="button" data-st="'+x[0]+'" aria-pressed="'+(quick===x[0])+'"><span class="sd sc-'+x[2]+'">'+(x[2]==='ok'||x[2]==='teal'?'✓':x[2]==='bad'?'✕':x[2]==='grey'?'⊘':x[2]==='dark'?'?':'!')+'</span>'+esc(x[1])+'<span class="n'+(n?'':' zero')+'">'+n+'</span></button>'}).join('');
}
document.getElementById('slane').addEventListener('click',function(e){var b=e.target.closest('[data-st]');if(!b)return;quick=b.dataset.st||null;PAGE.n=1;refresh()});
function renderApplied(){
  var el=document.getElementById('applied'),b=document.getElementById('fcount');
  b.hidden=!applied.length;b.textContent=applied.length;
  el.innerHTML=applied.length?applied.map(function(c){return '<span class="achip" data-tip="'+esc(c.label+' '+c.opName.toLowerCase()+': '+c.values.join(', '))+'"><span class="l">'+esc(c.label)+'</span><span class="o">'+esc(cf.OPS[c.op].sql.split(' ')[0])+'</span><span class="v">'+esc(c.values.join(', '))+'</span><span class="x" data-rm="'+c.id+'" title="Убрать условие">✕</span></span>'}).join('')+'<span class="fchip" id="fclear" style="height:24px;font-size:12px">Сбросить</span>':'<span class="lbl">условия не заданы</span>';
}
document.getElementById('applied').addEventListener('click',function(e){

function togglePanel(on){var h=document.getElementById('cf-host'),t=document.getElementById('ftoggle');if(on==null)on=!h.classList.contains('on');h.classList.toggle('on',on);t.setAttribute('aria-expanded',String(on))}

refresh();
/* ---- открытие drawer ---- */
var pair=document.getElementById('pair'),slots={A:null,B:null};
function openDoc(i,slot){
  var idx=P.DOCS.length;P.DOCS.push(ROWS[i]);P.ui.push(P.mkui(true));
  if(slots[slot]){slots[slot].el.remove()}
  var el=document.createElement('div');el.className='dw';el.dataset.d=idx;el.dataset.slot=slot;el.dataset.row=i;
  if(slot==='B'&&slots.A)pair.insertBefore(el,slots.A.el);else if(slot==='A'&&slots.B)pair.appendChild(el);else pair.appendChild(el);
  slots[slot]={el:el,row:i};P.render(idx);
  el.insertAdjacentHTML('afterbegin','<span class="slotlbl">'+(slot==='A'?'A':'B · сравнение')+'</span>');
  mark();
}
function closeSlot(slot){if(!slots[slot])return;slots[slot].el.remove();slots[slot]=null;mark()}
function mark(){if(!slots)return;[].forEach.call(grid.querySelectorAll('tbody.row'),function(tr){var i=+tr.dataset.i;tr.classList.toggle('selA',!!slots.A&&slots.A.row===i);tr.classList.toggle('selB',!!slots.B&&slots.B.row===i)})}
var openT=null;
grid.addEventListener('dblclick',function(e){var op=e.target.closest('[data-open]');if(!op)return;clearTimeout(openT);openDoc(+op.dataset.open,'B')});
var toast=document.createElement('div');toast.className='toast';document.body.appendChild(toast);var toastT;
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toast.classList.remove('on')},1400)}
grid.addEventListener('click',function(e){
  if(e.target.closest('input[type=checkbox]'))return;
  var op=e.target.closest('[data-open]');if(op){var oi=+op.dataset.open;if(e.shiftKey){openDoc(oi,'B');return}
    /* одиночный клик — drawer A, двойной — B рядом; ждём 220 мс, чтобы отличить */
    clearTimeout(openT);openT=setTimeout(function(){openDoc(oi,'A')},220);return}
  var v=e.target.closest('.cv,.lk:not(.off)');if(v){var val=v.dataset.v;try{navigator.clipboard.writeText(val).then(function(){},function(){})}catch(_){}
    v.classList.add('flash');setTimeout(function(){v.classList.remove('flash')},600);say('Скопировано: '+val);}
});
/* один плавающий тултип на страницу: не режется шапкой и соседними колонками (внутри td overflow:hidden) */
var gtip=document.createElement('div');gtip.id='gtip';document.body.appendChild(gtip);
function showTip(el,text){var z=parseFloat(document.documentElement.style.zoom)||1,r=el.getBoundingClientRect(),L=r.left/z,T=r.top/z,W=r.width/z,B=r.bottom/z;gtip.textContent=text;gtip.classList.add('on');var w=gtip.offsetWidth,x=Math.max(6,Math.min(innerWidth/z-w-6,L+W/2-w/2)),y=T-gtip.offsetHeight-5;if(y<4)y=B+5;gtip.style.left=x+'px';gtip.style.top=y+'px'}
function hideTip(){gtip.classList.remove('on')}
grid.addEventListener('mouseover',function(e){
  var v=e.target.closest('.cv');if(v){if(v.hasAttribute('data-short')||v.scrollWidth>v.clientWidth+1)showTip(v,v.dataset.v);else hideTip();return}
  var t=e.target.closest('[data-tip]');if(t){showTip(t,t.dataset.tip);return}
  hideTip();
});
grid.addEventListener('mouseleave',hideTip);
document.querySelector('.gridwrap').addEventListener('scroll',hideTip);
pair.addEventListener('click',function(e){var x=e.target.closest('.x');if(x){var dw=x.closest('.dw');closeSlot(dw.dataset.slot)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!(e.target.closest&&e.target.closest('.acced,.fe,input'))){if(slots.B)closeSlot('B');else closeSlot('A')}});
/* повторный рендер drawer (после правок) затирает метку слота — возвращаем */
new MutationObserver(function(ms){ms.forEach(function(m){var dw=m.target.closest?m.target.closest('.dw'):null;if(dw&&dw.dataset.slot&&!dw.querySelector('.slotlbl'))dw.insertAdjacentHTML('afterbegin','<span class="slotlbl">'+(dw.dataset.slot==='A'?'A':'B · сравнение')+'</span>')})}).observe(pair,{childList:true,subtree:true});
/* первая строка открыта сразу, чтобы страница не встречала пустым drawer-ом */
openDoc(0,'A');
})();
