{{STYLE}}
<style>
.zoomctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);height:24px}
.zoomctl button{font:500 11.5px var(--sans);color:var(--ink2);background:none;border:0;padding:0 8px;cursor:pointer}
.zoomctl button+button{border-left:1px solid var(--line)}
.zoomctl button[aria-pressed="true"]{background:var(--val-soft);color:var(--val)}
/* ===== реестр ===== */
html,body{height:100%}
body{margin:0;overflow:hidden}
/* Flex, а не grid с позиционными рядами: скрытый через display:none
   элемент (полоса прогресса) выпадал из сетки, и гибкий ряд доставался
   подвалу — пагинация раздувалась на всю свободную высоту. */
.app{display:flex;flex-direction:column;height:100%;background:var(--paper)}
.app>*{flex:none}
.apph{display:flex;align-items:center;gap:14px;padding:12px 20px 8px;border-bottom:1px solid var(--line)}
.apph h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.apph .cnt{font-size:12.5px;color:var(--muted)}
.apph .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.apph a{color:var(--val);font-size:12.5px;text-decoration:none}
.apph a:hover{text-decoration:underline}
.slane{display:flex;align-items:center;gap:2px;padding:4px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.slane .chbtn{margin-left:auto;flex:none;display:inline-grid;place-items:center;width:28px;height:28px;margin-bottom:2px;
              border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink2);cursor:pointer}
.slane .chbtn svg{width:15px;height:15px}
.slane .chbtn:hover{border-color:var(--val);color:var(--val)}
.slane .chbtn[aria-pressed="true"]{background:var(--val-soft);border-color:var(--val);color:var(--val)}
.slane .chbtn:focus-visible{outline:2px solid var(--val);outline-offset:1px}
.slane::-webkit-scrollbar{display:none}
.slane button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;font:500 12.5px var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
.slane button:hover{color:var(--ink);background:var(--hover)}
.slane button[aria-pressed="true"]{color:var(--val);border-bottom-color:var(--val)}
.slane .sd{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 9px var(--sans)}
.slane .n{min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--chip);color:var(--ink2);font:600 11px var(--sans);display:grid;place-items:center}
.slane button[aria-pressed="true"] .n{background:var(--val);color:var(--paper)}
.slane .n.zero{color:var(--faint);background:none;border:1px solid var(--line2)}
/* 4 семейства: в движении (синее) · внимание (красно-янтарное) · завершено успешно (зелёное) · завершено нейтрально (серое) */
/* те же токены, что у линий графика: в тёмной теме свои шаги */
.sc-flow{background:var(--st-flow)} .sc-flowl{background:var(--st-flowl)} .sc-flowd{background:var(--st-flowd)}
.sc-bad{background:var(--st-bad)} .sc-badd{background:var(--st-badd)} .sc-warn{background:var(--st-warn)}
.sc-ok{background:var(--st-ok)} .sc-okl{background:var(--st-okl)} .sc-grey{background:var(--st-grey)}
.sc-info{background:var(--val)} .sc-wait{background:var(--warn)}
.grid .stdot{margin-left:0}
.grid .lk{display:inline-block;font:500 11px/14px var(--sans);color:var(--val);cursor:copy;padding:0 2px;border-radius:3px;margin-left:-2px;letter-spacing:-.01em}
.grid .lk:hover{background:var(--val-soft)}
.grid .lk.off{color:var(--faint);cursor:default;text-decoration:line-through;text-decoration-color:var(--line)}
.grid .lk.off:hover{background:none}
.grid .lk.flash{background:var(--ok-soft);color:var(--ok)}
.grid .lks{display:flex;gap:3px;margin-top:2px}
/* обёртка width:0/min-width:100%: содержимое второй строки не влияет на ширину колонок, но занимает всю ширину */
.grid tr.purow td .inner{display:flex;align-items:center;gap:6px;width:0;min-width:100%}
.grid tr.purow td .inner .cv{flex:1;min-width:0;max-width:none;display:block}
.grid tr.purow td .inner .fno,.grid tr.purow td .inner .sd{flex:none}
.grid tr.purow td.reason{padding:0 8px 8px;border-bottom:1px solid var(--line);font:11px var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden}
.grid td.icons{white-space:nowrap}
.grid td.icons .stdot{margin-left:4px}
.grid tr.purow td.reason .sd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:2px}

.filters{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:12.5px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 8px;height:28px;width:280px;color:var(--muted)}
.search input{border:0;outline:0;background:none;font:12.5px var(--sans);color:var(--ink);flex:1}
.fchip{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:0 9px;height:28px;display:inline-flex;align-items:center;gap:5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.fchip b{font-weight:600;color:var(--ink)}
.fchip.on{border-color:var(--val);background:var(--val-soft);color:var(--val)}
.fchip .chev{font-size:9px;color:var(--faint)}
.filters .sp{margin-left:auto;display:flex;gap:8px}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--val);background:var(--val);color:var(--paper);font:500 12.5px var(--sans);cursor:pointer}
.fbtn .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.25);font:600 11px var(--sans);display:grid;place-items:center}
.fbtn svg{width:14px;height:14px}
.fbtn.ghost{background:var(--paper);color:var(--ink2);border-color:var(--line)}
.applied{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.achip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 4px 0 8px;border-radius:5px;background:var(--val-soft);color:var(--val);font-size:12px;white-space:nowrap;max-width:360px}
.achip .l{color:var(--ink2)}
.achip .o{font:600 11px var(--mono);color:var(--muted)}
.achip .v{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.achip .x{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:11px;margin-left:0}
.achip .x:hover{background:var(--paper);color:var(--bad)}
#skprog{display:none}
#skprog.on{display:block}
.skbtn{height:24px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font:500 11.5px var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
.skbtn:hover{border-color:var(--val);color:var(--val)}
.skbtn[aria-pressed="true"]{background:var(--val-soft);color:var(--val);border-color:var(--val)}
#cf-host{display:none}
#cf-host.on{display:block}
.cf .cf-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gridwrap{overflow:auto;position:relative;flex:1 1 auto;min-height:0}
.grid{border-collapse:separate;border-spacing:0;width:max-content;font-size:12.5px;line-height:1.35;table-layout:auto}
.grid.fixed{table-layout:fixed}
.grid.fixed td{overflow:hidden}
.grid th{position:relative}
.rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:3}
.rz::after{content:'';position:absolute;left:3px;top:8px;bottom:8px;width:1px;background:var(--line)}
.rz:hover::after,.rz.on::after{background:var(--val);width:2px}
body.resizing{cursor:col-resize;user-select:none}
.grid th{position:sticky;top:0;z-index:2;background:var(--paper);text-align:left;font:600 12.5px var(--sans);color:var(--ink);padding:9px 8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th .sub{display:block;font:11px var(--sans);color:var(--muted);font-weight:400;min-height:14px;overflow:hidden;text-overflow:ellipsis}
.grid th{overflow:hidden}
.grid th.sortable{cursor:pointer;user-select:none}
.grid th.sortable:hover{background:var(--hover)}
.grid th .sarrow{margin-left:4px;font-size:11px;color:var(--faint)}
.grid th.sorted{color:var(--val)}
.grid th.sorted .sarrow{color:var(--val)}
.grid th.sorted .sub{color:var(--val)}
.sortmenu{position:fixed;z-index:70;min-width:200px;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:4px 0}
.sortmenu .smt{font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:5px 12px 4px}
.sortmenu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;text-align:left;font:12.5px var(--sans);color:var(--ink2);padding:5px 12px;cursor:pointer}
.sortmenu button:hover{background:var(--hover)}
.sortmenu button.on{color:var(--val);font-weight:500}
.sortmenu button.reset{border-top:1px solid var(--line2);margin-top:3px;color:var(--muted);font-size:12px}
.grid td{padding:8px 8px 4px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.grid td[rowspan]{padding-bottom:8px}
.grid tbody.row{cursor:default}
.grid tbody.row:hover td{background:var(--hover)}
.grid tbody.row.selA td{background:var(--val-soft)}
.grid tbody.row.selA td:first-child{box-shadow:inset 3px 0 0 var(--val)}
.grid tbody.row.selB td{background:var(--warn-row)}
.grid tbody.row.selB td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.grid tr.purow td.purp{padding:0 8px 8px;border-bottom:1px solid var(--line);font:11px var(--sans);color:var(--ink2);text-transform:none;letter-spacing:0;max-width:none;margin:0;display:table-cell}
.grid tr.purow .fno{font:600 10.5px var(--mono);color:var(--muted);cursor:help}
.grid tbody.row tr:first-child td:not([rowspan]){border-bottom:0;padding-bottom:3px}
.grid [data-tip]::after{display:none}
#gtip{position:fixed;z-index:80;background:var(--ink);color:var(--paper);font:500 11px/1.3 var(--sans);padding:3px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
#gtip.on{opacity:1}
.appf .pg button{min-width:24px;height:22px;padding:0 6px;border:0;border-radius:4px;background:none;cursor:pointer;color:var(--ink2);font:11px var(--sans)}
.appf .pg button:hover{background:var(--hover)}
.appf .pg button.on{background:var(--val);color:var(--paper)}
.appf .pg button[disabled]{color:var(--faint);cursor:default;background:none}
.appf .pg .gap{color:var(--faint);padding:0 2px}
.appf .psz select{height:22px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font:11px var(--sans);color:var(--ink2);margin-left:4px}
.cv{display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;cursor:copy;border-radius:3px;padding:0 2px;margin:0 -2px}
.cv:hover{background:var(--val-soft)}
.cv.flash{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:20px;bottom:44px;z-index:60;background:var(--ink);color:var(--paper);font:12px var(--sans);padding:6px 10px;border-radius:5px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;pointer-events:none;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.on{opacity:1}
.grid .ico.open{color:var(--val)}
.grid .num{display:block;font-size:10.5px;color:var(--faint);margin-top:3px;text-align:center}
/* главное действие строки — настоящая кнопка: доступна с клавиатуры, имеет имя и фокус */
.grid .ico{display:inline-grid;place-items:center;width:24px;height:24px;border:0;padding:0;background:none;
           border-radius:4px;color:var(--muted);vertical-align:middle;cursor:pointer}
.grid .ico:focus-visible{outline:2px solid var(--val);outline-offset:1px;color:var(--val)}
.grid .ico:hover{background:var(--paper);color:var(--val);box-shadow:0 0 0 1px var(--line)}
.grid .ico svg{width:14px;height:14px}
.grid .stdot{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font:700 10px var(--sans);vertical-align:middle;margin-left:4px}
.grid .stdot.ok{background:var(--ok)} .grid .stdot.bad{background:var(--bad)} .grid .stdot.wait{background:var(--warn)}
.grid .id b{font-weight:600}
.grid .l2{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.grid .l2 .v{color:var(--val)}
.grid .l2.mono{font-family:var(--mono)}
.grid .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;display:block}
.grid .amt+.l2{text-align:right;color:var(--ink2);font-weight:400;font-size:11px}
.grid .fld{display:flex;gap:6px;align-items:baseline}
.grid .fld .op{font:700 12.5px var(--mono);color:var(--opt);min-width:9px}
.grid .fld .mono{font-size:12.5px;color:var(--ink)}
.grid .fld .nm{font-size:12.5px;color:var(--ink)}
.grid .cap{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.grid .purp{font:11px var(--sans);color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;margin-top:4px;max-width:720px;overflow:hidden;text-overflow:ellipsis}
.grid .dir{display:flex;gap:5px;align-items:center;color:var(--ink)}
.grid .dir svg{width:13px;height:13px;color:var(--muted)}
.grid .dir .dg{width:13px;text-align:center;color:var(--muted);font-size:12.5px}
/* S/R: без рамок, роль подписывает служебный токен S:/R: */
/* Провайдеры — короткие коды систем, а не реквизиты: тег отделяет их от значений */
.grid .prov .tag{display:block;width:max-content;margin-bottom:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.grid .tag.snd{color:var(--warn);border-color:var(--warn)} .grid .tag.rcv{color:var(--ok);border-color:var(--ok)}
.grid .srl{display:block;white-space:nowrap;line-height:17px}
.grid .srl .k{display:inline-block;width:14px;font:11px var(--sans);color:var(--faint)}
.grid .srl .cv{font:12.5px var(--mono);color:var(--ink);max-width:none}
/* счёт в маршруте: первые 8 знаков (6–8 — код валюты) … последние 3 */
.grid .acct b{font-weight:600;color:var(--ink)}
.grid .acct .e{color:var(--faint);padding:0 1px}
.grid .nl{color:var(--faint)}
.appf{display:flex;align-items:center;gap:14px;padding:7px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--sunk)}
.appf .pg{display:inline-flex;gap:2px}
.appf .pg span{min-width:24px;height:22px;display:grid;place-items:center;border-radius:4px;cursor:pointer;color:var(--ink2)}
.appf .pg span.on{background:var(--val);color:var(--paper)}
.appf .sp{margin-left:auto}
/* ===== drawer host ===== */
#pair{position:fixed;top:0;right:0;bottom:0;display:flex;justify-content:flex-end;align-items:stretch;gap:0;z-index:50;pointer-events:none}
#pair .dw{pointer-events:auto;height:100%;overflow-y:auto;border-radius:0;box-shadow:-8px 0 28px rgba(20,26,41,.14);border-left:1px solid var(--line);transform:translateX(30px);opacity:0;animation:slidein .18s ease-out forwards}
@keyframes slidein{to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#pair .dw{animation:none;transform:none;opacity:1}}
#pair .dw .fold{display:none}
#pair .dw[data-slot="B"]{box-shadow:-8px 0 28px rgba(20,26,41,.1)}
#pair .dw .dh .back{display:none}
.slotlbl{position:sticky;top:0;z-index:6;float:right;font:600 10px var(--sans);letter-spacing:.06em;color:var(--paper);background:var(--val);padding:1px 6px;border-radius:0 0 0 4px}
.dw[data-slot="B"] .slotlbl{background:var(--warn)}
</style>

/* ---- фильтры: каталог для реестра (конструктив из vtb-filters), значения справочников — из строк ---- */
function uniq(fn){var s={};ROWS.forEach(function(d){var v=fn(d);if(v)s[v]=1});return Object.keys(s).sort()}
function lines(d,t){var f=d.f[t];return f?(f.edit||f).lines:[]}
function bic(d,t){var L=lines(d,t);return L[L.length-1]||''}
var ACC={
  docId:function(d){return d.uuid},docNumber:function(d){return d.num},refIn:function(d){return d.f['20'].lines[0]},refOut:function(d){return d.r20out},
  status:function(d){return SM[d.status].label},reason:function(d){return d.reason},type:function(d){return d.type},direction:function(d){return d.dir},dirTxt:function(d){return d.dirTxt},purpose:function(d){return lines(d,'70').join(' ')},
  created:function(d){return d.created.slice(0,10)},valueDate:function(d){return d.vd[0]},vdDt:function(d){return d.vd[2]},vdKt:function(d){return d.vd[3]},
  amount:function(d){return d.amount.replace(/\s/g,'')},currency:function(d){return d.ccy},dtAcc:function(d){return d.dt.replace(/\s/g,'')},ktAcc:function(d){return d.kt.replace(/\s/g,'')},
  f50name:function(d){return lines(d,'50')[0]||''},f50acc:function(d){return (d.f['50']||{}).acc||''},f59name:function(d){return lines(d,'59')[0]||''},f59acc:function(d){return (d.f['59']||{}).acc||''},
  f52:function(d){return bic(d,'52')},f57:function(d){return bic(d,'57')},f58:function(d){return bic(d,'58')},
  routeType:function(d){return d.route.type},routeRecv:function(d){return d.route.recv},sender:function(d){return d.inS},receiver:function(d){return d.inR},
  outSender:function(d){return d.outS},outReceiver:function(d){return d.outR},provS:function(d){return d.provS},provR:function(d){return d.provR}
};
function F(id,label,type,dict){return {id:id,label:label,type:type||'text',dict:dict||uniq(ACC[id]).slice(0,12)}}
var CATALOG=[
  {group:'Основные',fields:[F('docId','ID документа'),F('docNumber','Номер документа'),F('refIn','Поле 20 (входящее)'),F('refOut','Поле 20 (исходящее)'),F('status','Статус','select',STATUS_META.map(function(x){return x[1]})),F('reason','Причина статуса','select',REASONS),F('type','Тип сообщения','select'),F('direction','Группа направления','select',['IN','OUT','TRANSIT','OTHER']),F('dirTxt','Название направления','select'),F('purpose','Назначение (70)')]},
  {group:'Даты',fields:[F('created','Дата документа','date'),F('valueDate','Дата валютирования','date'),F('vdDt','Валютирование по Дт','date'),F('vdKt','Валютирование по Кт','date')]},
  {group:'Финансы',fields:[F('amount','Сумма','number'),F('currency','Валюта','select'),F('dtAcc','Счёт Дт'),F('ktAcc','Счёт Кт')]},
  {group:'Контрагенты',fields:[F('f50name','Поле 50 (наименование)'),F('f50acc','Поле 50 (счёт)'),F('f59name','Поле 59 (наименование)'),F('f59acc','Поле 59 (счёт)')]},
  {group:'Банки (SWIFT-коды)',fields:[F('f52','Поле 52'),F('f57','Поле 57'),F('f58','Поле 58')]},
  {group:'Маршрут',fields:[F('routeType','Тип маршрута','select'),F('routeRecv','Receiver'),F('sender','S in'),F('receiver','R in'),F('outSender','S out'),F('outReceiver','R out'),F('provS','Провайдер отправителя','select'),F('provR','Провайдер получателя','select')]}
];
var DEMO_SETS=[
  {id:'demo-1',name:'Входящие USD исполненные',data:{visible:['direction','currency','status'],ops:{direction:'eq',currency:'eq',status:'eq'},values:{direction:{list:[],draft:'IN'},currency:{list:[],draft:'USD'},status:{list:[],draft:'Обработан'}}}},
  {id:'demo-2',name:'Проблемные MT103/MT202',data:{visible:['type','status','amount'],ops:{type:'in',status:'in',amount:'gt'},values:{type:{list:['MT103','MT202'],draft:''},status:{list:['Ошибка','Отказ','INVALID'],draft:''},amount:{list:[],draft:'100000'}}}}];
function toNum(v){var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n}
function toDate(v){var m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(v).trim());if(m)return m[3]+m[2]+m[1];m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v).trim());return m?m[1]+m[2]+m[3]:null}
function cmp(field,a,b){if(field.type==='number'){var x=toNum(a),y=toNum(b);return x==null||y==null?null:x-y}if(field.type==='date'){var p=toDate(a),q=toDate(b);return p==null||q==null?null:(p<q?-1:p>q?1:0)}return String(a).localeCompare(String(b))}
function match(field,op,val,cond,list){
  var v=String(val==null?'':val),lv=v.toLowerCase(),c=String(cond||'').trim(),lc=c.toLowerCase();
  switch(op){
    case 'contains':return lv.indexOf(lc)>=0;
    case 'startsWith':return lv.indexOf(lc)===0;
    case 'endsWith':return lv.slice(-lc.length)===lc;
    case 'eq':return field.type==='number'||field.type==='date'?cmp(field,v,c)===0:lv===lc;
    case 'ne':return field.type==='number'||field.type==='date'?cmp(field,v,c)!==0:lv!==lc;
    case 'gt':var g=cmp(field,v,c);return g!=null&&g>0;
    case 'lt':var l=cmp(field,v,c);return l!=null&&l<0;
    case 'in':return list.some(function(x){return field.type==='number'||field.type==='date'?cmp(field,v,x)===0:String(x).toLowerCase()===lv});
    case 'notIn':return !list.some(function(x){return field.type==='number'||field.type==='date'?cmp(field,v,x)===0:String(x).toLowerCase()===lv});
  }return true;
}
var cf=window.CF({root:document.getElementById('cf-host'),catalog:CATALOG,defaultIds:['refIn','status','type','currency'],demoSets:DEMO_SETS,storageKey:'pi-grid-filter-sets-v1',

function byPanel(){return ROWS.map(function(_,i){return i}).filter(function(i){var d=ROWS[i];return applied.every(function(c){var field=cf.FIELD_BY_ID[c.id];return match(field,c.op,ACC[c.id](d),c.values[0],c.values)})})}

/* ============ график динамики по статусам ============
   Данные стенда: ряды заканчиваются ровно на счётчиках лейна, иначе
   график противоречил бы числам прямо над ним. Шаг — минута, как у
   метода бекенда; агрегация на бекенде, здесь только отрисовка. */
/* цвет берём токеном: тёмная тема имеет свои шаги, проверенные к своей поверхности */
var SC_COLOR={};['flow','flowl','flowd','bad','badd','warn','ok','okl','grey']
  .forEach(function(k){SC_COLOR[k]='var(--st-'+k+')'});
/* диапазоны панели; шаг ряда всегда минутный, как отдаёт бекенд */
function minutesToday(){var d=new Date();return Math.max(60,d.getHours()*60+d.getMinutes()+1)}
var CH_RANGES=[{label:'Сегодня',minutes:0},{label:'3 дня',minutes:4320},{label:'7 дней',minutes:10080}];
var chCtl=null,chTimer=null;

function genPoints(end,n,seed){
  /* Свободное блуждание за 720 минут уходит далеко от текущего значения
     и упирается в ноль. Очередь так себя не ведёт: она колеблется вокруг
     своего уровня. Поэтому медленная волна + мелкая рябь + слабый шум. */
  var r=seed||1;
  function rnd(){r=(r*1103515245+12345)&0x7fffffff;return r/0x7fffffff}
  var base=Math.max(end,1),ph1=rnd()*6.283,ph2=rnd()*6.283,
      sw=1.2+rnd()*1.6,out=new Array(n);
  for(var i=0;i<n;i++){
    var t=i/(n-1),
        wave=Math.sin(t*6.283*sw+ph1)*0.30+Math.sin(t*6.283*5+ph2)*0.10,
        noise=(rnd()-0.5)*0.07;
    out[i]=Math.max(0,Math.round(base*(1+wave+noise)));
  }
  out[n-1]=end;                    /* последняя точка равна счётчику лейна */
  return out;
}
function chSeries(minutes){
  /* По всем документам, а не по текущей выборке: график показывает
     обстановку в системе. От lastIdx у скрытых статусов обнулялись
     ряды, и переключение линий переставало что-либо показывать. */
  var cnt={};ROWS.forEach(function(r){cnt[r.status]=(cnt[r.status]||0)+1});
  return STATUS_META.map(function(x,k){
    return {key:x[0],label:x[1],color:SC_COLOR[x[2]]||'#3A6EA5',points:genPoints(cnt[x[0]]||0,minutes,7919*(k+1)+13)};
  });
}
function chClose(){
  if(chTimer){clearInterval(chTimer);chTimer=null}
  chCtl=null;var h=document.getElementById('chhost');h.innerHTML='';h.className='';
  var b=document.getElementById('chartbtn');if(b)b.setAttribute('aria-pressed','false');
}
function chOpen(){
  var host=document.getElementById('chhost');
  document.getElementById('chartbtn').setAttribute('aria-pressed','true');
  /* первая загрузка — скелетоны панелей той же геометрии */
  host.className='ch';
  host.innerHTML='<div class="ch-head"><h3>Динамика по статусам</h3></div>'+
    '<div class="ch-plot">'+SK.sk('100%','116px','sq')+'</div>'+
    '<div class="ch-leg">'+STATUS_META.map(function(){return SK.sk('84px','22px','sq')}).join('')+'</div>';
  setTimeout(function(){
    chCtl=CH.mount(host,{series:chSeries(minutesToday()),endAt:new Date(),stepMin:1,minutes:0,
      ranges:CH_RANGES,
      onRange:function(m){chCtl.cfg.series=chSeries(m||minutesToday());chCtl.cfg.endAt=new Date()},
      onClose:chClose});
    /* бекенд складывает срез раз в минуту — обновляемся в том же такте */
    chTimer=setInterval(chRefresh,60000);
  },450);
}
function chRefresh(){
  if(!chCtl)return;
  chCtl.cfg.busy=true;chCtl.render();
  setTimeout(function(){
    chCtl.cfg.series=chSeries(chCtl.cfg.minutes||minutesToday());chCtl.cfg.endAt=new Date();
    chCtl.cfg.busy=false;chCtl.render();
  },500);
}
document.getElementById('slane').addEventListener('click',function(e){
  if(e.target.closest('#chartbtn')){chCtl?chClose():chOpen();return}
});

/* лейн статусов: счётчики по текущей выборке панели и быстрый фильтр (один статус или все) */

    '<button type="button" class="chbtn" id="chartbtn" aria-pressed="'+!!chCtl+'" data-tip="Динамика по статусам во времени" aria-label="Динамика по статусам во времени">'+ic('chart')+'</button>';
}

var pair=document.getElementById('pair'),slots={A:null,B:null};
function openDoc(i,slot){
  var idx=P.DOCS.length;P.DOCS.push(ROWS[i]);P.ui.push(P.mkui(true));
  if(slots[slot]){slots[slot].el.remove()}
  var el=document.createElement('div');el.className='dw';el.dataset.d=idx;el.dataset.slot=slot;el.dataset.row=i;
  if(slot==='B'&&slots.A)pair.insertBefore(el,slots.A.el);else if(slot==='A'&&slots.B)pair.appendChild(el);else pair.appendChild(el);
  slots[slot]={el:el,row:i};P.render(idx);
  el.insertAdjacentHTML('afterbegin','<span class="slotlbl">'+(slot==='A'?'A':'B · сравнение')+'</span>');
  mark();
}

function mark(){if(!slots)return;[].forEach.call(grid.querySelectorAll('tbody.row'),function(tr){var i=+tr.dataset.i;tr.classList.toggle('selA',!!slots.A&&slots.A.row===i);tr.classList.toggle('selB',!!slots.B&&slots.B.row===i)})}

grid.addEventListener('dblclick',function(e){var op=e.target.closest('[data-open]');if(!op)return;clearTimeout(openT);openDoc(+op.dataset.open,'B')});
var toast=document.createElement('div');toast.className='toast';document.body.appendChild(toast);var toastT;
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toast.classList.remove('on')},1400)}
grid.addEventListener('click',function(e){

  var op=e.target.closest('[data-open]');if(op){var oi=+op.dataset.open;if(e.shiftKey){openDoc(oi,'B');return}
    /* одиночный клик — drawer A, двойной — B рядом; ждём 220 мс, чтобы отличить */
    clearTimeout(openT);openT=setTimeout(function(){openDoc(oi,'A')},220);return}
  var v=e.target.closest('.cv,.lk:not(.off)');if(v){var val=v.dataset.v;try{navigator.clipboard.writeText(val).then(function(){},function(){})}catch(_){}
    v.classList.add('flash');setTimeout(function(){v.classList.remove('flash')},600);say('Скопировано: '+val);}
});
/* один плавающий тултип на страницу: не режется шапкой и соседними колонками (внутри td overflow:hidden) */
var gtip=document.createElement('div');gtip.id='gtip';document.body.appendChild(gtip);
function showTip(el,text){var z=parseFloat(document.documentElement.style.zoom)||1,r=el.getBoundingClientRect(),L=r.left/z,T=r.top/z,W=r.width/z,B=r.bottom/z;gtip.textContent=text;gtip.classList.add('on');var w=gtip.offsetWidth,x=Math.max(6,Math.min(innerWidth/z-w-6,L+W/2-w/2)),y=T-gtip.offsetHeight-5;if(y<4)y=B+5;gtip.style.left=x+'px';gtip.style.top=y+'px'}
function hideTip(){gtip.classList.remove('on')}
grid.addEventListener('mouseover',function(e){
  var v=e.target.closest('.cv');if(v){if(v.hasAttribute('data-short')||v.scrollWidth>v.clientWidth+1)showTip(v,v.dataset.v);else hideTip();return}
  var t=e.target.closest('[data-tip]');if(t){showTip(t,t.dataset.tip);return}
  hideTip();
});
grid.addEventListener('mouseleave',hideTip);
document.querySelector('.gridwrap').addEventListener('scroll',hideTip);
pair.addEventListener('click',function(e){var x=e.target.closest('.x');if(x){var dw=x.closest('.dw');closeSlot(dw.dataset.slot)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!(e.target.closest&&e.target.closest('.acced,.fe,input'))){if(slots.B)closeSlot('B');else closeSlot('A')}});
/* повторный рендер drawer (после правок) затирает метку слота — возвращаем */
new MutationObserver(function(ms){ms.forEach(function(m){var dw=m.target.closest?m.target.closest('.dw'):null;if(dw&&dw.dataset.slot&&!dw.querySelector('.slotlbl'))dw.insertAdjacentHTML('afterbegin','<span class="slotlbl">'+(dw.dataset.slot==='A'?'A':'B · сравнение')+'</span>')})}).observe(pair,{childList:true,subtree:true});
/* первая строка открыта сразу, чтобы страница не встречала пустым drawer-ом */
openDoc(0,'A');
})();
